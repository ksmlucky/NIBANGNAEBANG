<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">니방내방 기능 요약</title><desc id="desc">방 양도 정보를 등록하고 주소·계약 조건·지도로 방을 찾아보는 웹 서비스 프로젝트입니다. 게시판과 쪽지 기능도 구현했습니다. 방 등록: 계약 조건·주소·옵션: 사진을 담은 단계별 입력 → 조건과 지도: 주소별 목록 탐색: 지도에서 상세 정보 확인 → 게시판·쪽지: 커뮤니티와 메시지: 회원 인증·읽음 관리 설명용 도식입니다.</desc><rect width="1200" height="720" rx="24" fill="#EDF5FF"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" fill="#173554"><rect x="52" y="47" width="7" height="25" rx="3" fill="#256EBA"/><text x="74" y="67" font-size="21" font-weight="600" fill="#256EBA">SSAFY 7기 2학기 팀 프로젝트 · 방 양도</text><text x="52" y="148" font-size="58" font-weight="800" letter-spacing="-2">니방내방</text><text x="54" y="203" font-size="28" letter-spacing="-.6">내놓을 방을 등록하고, 조건과 지도로 살펴봅니다.</text><text x="54" y="257" font-size="17" letter-spacing="3" fill="#256EBA">HOW IT WORKS</text><g transform="translate(52,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#D1E5FA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#256EBA">01</text><g transform="translate(60,51)"><path d="M56 48L120 0L184 48 M69 39V99h102V39 M106 99V66h28v33" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="91" y="39" width="15" height="15" rx="1" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="135" y="39" width="15" height="15" rx="1" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">방 등록</text><text x="28" y="248" font-size="23">계약 조건·주소·옵션</text><text x="28" y="281" font-size="23" fill="#256EBA">사진을 담은 단계별 입력</text></g><g transform="translate(422,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#D1E5FA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#256EBA">02</text><g transform="translate(60,51)"><path d="M120 99S82 59 82 37a38 38 0 0 1 76 0c0 22-38 62-38 62Z" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="36" r="12" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">조건과 지도</text><text x="28" y="248" font-size="23">주소별 목록 탐색</text><text x="28" y="281" font-size="23" fill="#256EBA">지도에서 상세 정보 확인</text></g><g transform="translate(792,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#D1E5FA"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#256EBA">03</text><g transform="translate(60,51)"><rect x="49" y="8" width="111" height="65" rx="8" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 73v19l22-19 M177 34h14v62h-28l-16 14v-14h-26 M69 30h71 M69 48h45" fill="none" stroke="#256EBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">게시판·쪽지</text><text x="28" y="248" font-size="23">커뮤니티와 메시지</text><text x="28" y="281" font-size="23" fill="#256EBA">회원 인증·읽음 관리</text></g><line x1="54" y1="629" x2="1146" y2="629" stroke="#256EBA" opacity=".2"/><text x="54" y="668" font-size="20" fill="#256EBA">브랜치별 구현 개요 · 화면과 서버의 통합 실행은 재검증 전</text><text x="1145" y="701" text-anchor="end" font-size="12" letter-spacing="1.4" opacity=".65">FEATURE OVERVIEW · NOT A LIVE SCREENSHOT</text></g></svg>
server:
  port: 8082
  ssl:
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: "${SERVER_SSL_KEY_STORE_PASSWORD}"
    enabled: true
#    key-alias: footprints
spring:

  application:
    name: business-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: "${SPRING_RABBITMQ_PASSWORD}"
  zipkin:
    base-url: http://127.0.0.1:9411
    enabled: true


  data:
    mongodb:
#      host: localhost
      host: deployment.example.invalid
      port: 27017
      authentication-database: admin
      username: k7c109
      password: "${SPRING_DATA_MONGODB_PASSWORD}"
      database: footprints_business
#    web:
#      pageable:
#        one-indexed-parameters: true

  redis:
    lettuce:
      pool:
        max-active: 5
        max-idle: 5
        min-idle: 2
    host: 127.0.0.1
    port: 6379
    password: "${SPRING_REDIS_PASSWORD}"

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB


  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins: '*'
              # - http://localhost:3000 #"https://deployment.example.invalid"
              # - https://deployment.example.invalid
              # - http://localhost
              # - https://deployment.example.invalid:8080
              # - https://deployment.example.invalid:8082
            allowedHeaders: 
              - Authorization
              - X-Authorization-Id
              - Content-Type
            allowedMethods:
              - GET
              - POST
              - PUT
              - OPTIONS
              - HEAD
              - DELETE

logging:
  level:
    org.hibernate.sql: DEBUG

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    non-secure-port-enabled: false
    secure-port-enabled: true
    securePort: ${server.port}
    statusPageUrl: https://deployment.example.invalid:${server.port}/info
    healthCheckUrl: https://deployment.example.invalid:${server.port}/health
    homePageUrl: https://deployment.example.invalid:${server.port}
#    statusPageUrl: https://${eureka.hostname}/info
#    healthCheckUrl: https://${eureka.hostname}/health
#    homePageUrl: https://${eureka.hostname}/
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, busrefresh, info, metrics, prometheus

jwt:
  secret: "${JWT_SECRET}"
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 86400

cloud:
  aws:
    credentials:
      access-key: "${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}"
      secret-key: "${CLOUD_AWS_CREDENTIALS_SECRET_KEY}"
    s3:
      bucket: c109-footprints
    region:
      static: ap-northeast-2
    stack:
      auto: false

auth_service:
  url: http://AUTH-SERVICE/api/%d/nickname
  exception:
    not_found_member: Member does not exist.

# freemarker
  devtools:
    restart:
      enabled: false
  freemarker:
    cache: false
  jackson:
    serialization:
      fail-on-empty-beans: false

